name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project.zip
        run: |
          test -f project.zip || { echo "project.zip is missing from the repo root"; exit 1; }
          unzip -q project.zip -d proj
          ls -la proj

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: proj
        run: gradle :app:assembleDebug --no-daemon

      - name: Keep APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASCII-Printer-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ASCII Printer build ${{ github.run_number }}
          files: proj/app/build/outputs/apk/debug/app-debug.apk
